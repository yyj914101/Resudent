<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 村级村务综合管理系统</title>
    <link href="/static/lib/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/tokens.css" rel="stylesheet">
    <link href="/static/css/auth_common.css" rel="stylesheet">
    <link href="/static/css/pages/auth_login.css" rel="stylesheet">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-topbar"></div>
        <main class="auth-main">
            <section class="auth-panel auth-panel--login">
                <div class="auth-card">
                    <div class="auth-login-head">
                        <div class="auth-login-mark"><i class="bi bi-building-check" aria-hidden="true"></i></div>
                        <div class="auth-login-head__text">
                            <div class="auth-login-head__sys">村级村务综合管理系统</div>
                            <h1 class="auth-login-head__title">系统登录</h1>
                        </div>
                    </div>

                    
                    
                    

                    <form method="post" id="loginForm">
                        <input type="hidden" name="csrf_token" value="__CSRF__">
                        <div class="auth-field">
                            <label class="auth-label" for="usernameInput">用户名</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-person auth-input-wrap__icon" aria-hidden="true"></i>
                                <input type="text" id="usernameInput" class="auth-input auth-input--with-icon" name="username" placeholder="请输入用户名" autocomplete="username" required autofocus>
                            </div>
                        </div>
                        <div class="auth-field auth-field--last">
                            <label class="auth-label" for="passwordInput">
                                <span>密码</span>
                                <span class="auth-caps" id="capsHint" hidden><i class="bi bi-capslock-fill" aria-hidden="true"></i>已开启大写锁定</span>
                            </label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-lock auth-input-wrap__icon" aria-hidden="true"></i>
                                <input type="password" id="passwordInput" class="auth-input auth-input--with-icon auth-input--with-toggle" name="password" placeholder="请输入登录密码" autocomplete="current-password" required>
                                <button type="button" class="auth-eye" id="togglePwdBtn" aria-label="显示或隐藏密码"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <button type="submit" class="auth-btn" id="loginSubmitBtn">
                            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                            <span>登录系统</span>
                        </button>
                    </form>

                    <div class="auth-demo-pill">
                        <span>默认初始账号</span>
                        <code>admin / admin123</code>
                    </div>
                </div>
            </section>
        </main>
        <footer class="auth-footer">村级村务综合管理平台</footer>
    </div>

    <!-- 032：登录页加载即清空 SPA 标签存储（登出→登录 或 token 过期被踢回本页时生效）；隐私模式/配额异常静默降级 -->
    <script>
    try { sessionStorage.removeItem('app_tabs_v2'); } catch (e) {}
    (function () {
        var pwd = document.getElementById('passwordInput');
        var btn = document.getElementById('togglePwdBtn');
        var caps = document.getElementById('capsHint');
        if (btn && pwd) {
            btn.addEventListener('click', function () {
                var show = pwd.type === 'password';
                pwd.type = show ? 'text' : 'password';
                btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });
            pwd.addEventListener('keyup', function (e) {
                if (caps && e.getModifierState) caps.hidden = !e.getModifierState('CapsLock');
            });
            pwd.addEventListener('blur', function () { if (caps) caps.hidden = true; });
        }
    })();
    </script>
</body>
</html>
