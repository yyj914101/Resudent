<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 村级村务综合管理系统</title>
    <link href="/static/lib/bootstrap.min.css" rel="stylesheet">
    <link href="/static/lib/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/pages/auth_change_password.css" rel="stylesheet">
</head>
<body>
    <section class="panel">
        <div class="top-line"></div>
        <div class="body">
            <h3>修改密码</h3>
            <div class="hint">为保障账号安全，首次登录或密码重置后须设置新密码。<br>新密码至少 8 位，且须同时包含字母和数字。</div>
            
            
                
                <div class="alert alert-warning alert-dismissible fade show py-2">首次登录或密码已重置，请先修改密码
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
            
            
            <form method="post">
                <input type="hidden" name="csrf_token" value="__CSRF__">
                <div class="mb-3">
                    <label class="form-label small text-muted">原密码</label>
                    <input type="password" class="auth-input" name="old_password" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">新密码</label>
                    <input type="password" class="auth-input" name="new_password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted">确认新密码</label>
                    <input type="password" class="auth-input" name="confirm_password" required>
                </div>
                <button type="submit" class="btn auth-btn w-100">确认修改</button>
            </form>
        </div>
    </section>
    <script src="/static/lib/bootstrap.bundle.min.js"></script>
</body>
</html>
