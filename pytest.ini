# pytest 项目配置（2026-11-25，任务 124）
#
# pythonpath=.：把应用根显式插进 sys.path，令存量测试的 `import config` 不再依赖
# 「cwd=应用根且不带 -I」的隐式惯例——此前 `python -I -m pytest`（隔离模式剥 cwd）
# 会令 70 个 import config 的测试文件在 setup 阶段集体 ModuleNotFoundError（47E 假红，
# 真失败被噪音淹没）。姿势免疫见 AGENTS.md「测试运行规约」。
#
# 注意：仅用 pythonpath 与 testpaths，不动任何 SHUCUN_* 环境口径——conftest.py 的
# 隔离夹具体系（isolated_app_factory 等）是唯一真源，此处不重复不覆盖。
[pytest]
pythonpath = .
testpaths = tests
