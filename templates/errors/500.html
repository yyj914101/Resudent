{% extends "base.html" %}
{% block title %}服务器错误{% endblock %}
{% block content %}
<div class="empty-state">
    <i class="bi bi-exclamation-triangle"></i>
    <h4>500 - 服务器内部错误</h4>
    <p>系统出现异常，请稍后重试。</p>
    {% if detail %}<p class="text-danger small">{{ detail }}</p>{% endif %}
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
