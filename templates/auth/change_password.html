<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 村级村务综合管理系统</title>
    <link href="{{ url_for('static', filename='lib/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='lib/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/pages/auth_change_password.css') }}" rel="stylesheet">
</head>
<body>
    <section class="panel">
        <div class="top-line"></div>
        <div class="body">
            <h3>修改密码</h3>
            <div class="hint">为保障账号安全，首次登录或密码重置后须设置新密码。<br>新密码至少 8 位，且须同时包含字母和数字。</div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show py-2">{{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label small text-muted">原密码</label>
                    <input type="password" class="auth-input" name="old_password" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">新密码</label>
                    <input type="password" class="auth-input" name="new_password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted">确认新密码</label>
                    <input type="password" class="auth-input" name="confirm_password" required>
                </div>
                <button type="submit" class="btn auth-btn w-100">确认修改</button>
            </form>
        </div>
    </section>
    <script src="{{ url_for('static', filename='lib/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
